# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Sameer Sayyad
email: sameer7sayyad@gmail.com
description: Writing about AI and Engineering
domain: sameerdev7.github.io
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://sameerdev7.github.io" # the base hostname & protocol for your site, e.g. http://example.com
linkedin_username: sameerdev7
github_username:  sameerdev7

# Build settings
# GitHub Pages applies its default "primer" theme unless this is nulled out.
theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
markdown: kramdown
highlighter: rouge
input: GFM
permalink: /:title/
sass:
  quiet_deps: true
  style: compressed

date_format: "%b %-d, %Y"

collections:
  notes:
    output: true
    permalink: /notes/:title/

defaults:
  # jekyll-seo-tag reads `image` from the page's own front matter only, not
  # from a top-level site config key — front matter defaults are the
  # documented way to give every page/post a fallback og:image.
  - scope:
      path: ""
    values:
      image: /assets/og-image.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      usemathjax: true
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      usemathjax: true

# SEO
author:
  name: Sameer Sayyad
social:
  name: Sameer Sayyad
  links:
    - https://www.linkedin.com/in/sameerdev7
    - https://github.com/sameerdev7

# Comments (giscus.app) - leave repo blank to keep comments disabled.
giscus:
  repo: "sameerdev7/sameerdev7.github.io"
  repo_id: "R_kgDOP7XHeQ"
  category: "General"
  category_id: "DIC_kwDOP7XHec4DGBiA"

# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# Gemfile, Gemfile.lock, vendor/bundle/, .jekyll-cache/, etc. are already
# excluded by Jekyll's internal defaults — this just adds our local-notes folder.
exclude:
  - docs/
