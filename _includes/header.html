<header class="site-header" role="banner">
  <div class="wrapper site-header-inner">
    <a class="site-title" href="{{ "/" | relative_url }}" rel="author">{{ site.title | escape }}</a>

    <nav class="site-nav">
      <a class="nav-link" href="{{ "/" | relative_url }}">Blog</a>
      <a class="nav-link" href="{{ "/notes/" | relative_url }}">Notes</a>
      <a class="nav-link" href="{{ "/projects/" | relative_url }}">Projects</a>
      <a class="nav-link" href="{{ "/tags/" | relative_url }}">Tags</a>
      <a class="nav-link" href="{{ "/about/" | relative_url }}">About</a>

      <span class="nav-icons">
        {%- if site.github_username -%}
        <a class="nav-link" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener me">GitHub</a>
        {%- endif -%}
        {%- include theme-toggle.html -%}
      </span>
    </nav>
  </div>
</header>
