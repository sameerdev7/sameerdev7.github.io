<footer class="site-footer">
  <div class="column footer-inner">
    <p>© {{ "now" | date: "%Y" }} {{ site.author.name | default: site.title }}</p>
    <ul class="footer-links">
      {%- if site.github_username -%}<li><a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener me">GitHub</a></li>{%- endif -%}
      {%- if site.linkedin_username -%}<li><a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener me">LinkedIn</a></li>{%- endif -%}
      {%- if site.email -%}<li><a href="mailto:{{ site.email }}">Email</a></li>{%- endif -%}
    </ul>
  </div>
</footer>
