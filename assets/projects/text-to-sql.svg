<circle cx="104" cy="146" r="12" fill="#6aa3ee"/>
<text x="128" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" font-weight="500" fill="#7e8aa0" text-anchor="start" >question</text>
<text x="94" y="196" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#e6e9ef" text-anchor="start" >Top 5 customers by</text>
<text x="94" y="228" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#e6e9ef" text-anchor="start" >revenue this quarter?</text>
