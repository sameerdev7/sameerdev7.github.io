<rect x="600" y="96" width="530" height="296" rx="18" fill="#10151d" stroke="#2a3447" stroke-width="1.5"/>
<circle cx="628" cy="124" r="6" fill="#ff5f57" fill-opacity=".85"/>
<circle cx="650" cy="124" r="6" fill="#febc2e" fill-opacity=".85"/>
<circle cx="672" cy="124" r="6" fill="#28c840" fill-opacity=".85"/>
<text x="1100" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" font-weight="500" fill="#7e8aa0" text-anchor="end" >query.sql</text>
<text x="628" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17" xml:space="preserve"><tspan fill="#e58fc2">SELECT </tspan><tspan fill="#e6e9ef">c.name, </tspan><tspan fill="#6aa3ee">SUM</tspan><tspan fill="#e6e9ef">(o.total) </tspan><tspan fill="#e58fc2">AS </tspan><tspan fill="#e6e9ef">revenue</tspan></text>
<text x="628" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17" xml:space="preserve"><tspan fill="#e58fc2">FROM </tspan><tspan fill="#e6e9ef">customers c</tspan></text>
<text x="628" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17" xml:space="preserve"><tspan fill="#e58fc2">JOIN </tspan><tspan fill="#e6e9ef">orders o </tspan><tspan fill="#e58fc2">ON </tspan><tspan fill="#e6e9ef">o.customer_id = c.id</tspan></text>
<text x="628" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17" xml:space="preserve"><tspan fill="#e58fc2">WHERE </tspan><tspan fill="#e6e9ef">o.created_at &gt;= </tspan><tspan fill="#7fd39a">'2026-01-01'</tspan></text>
<text x="628" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17" xml:space="preserve"><tspan fill="#e58fc2">GROUP BY </tspan><tspan fill="#e6e9ef">c.name</tspan></text>
<text x="628" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17" xml:space="preserve"><tspan fill="#e58fc2">ORDER BY </tspan><tspan fill="#e6e9ef">revenue </tspan><tspan fill="#e58fc2">DESC</tspan></text>
<text x="628" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17" xml:space="preserve"><tspan fill="#e58fc2">LIMIT </tspan><tspan fill="#e8b05f">5</tspan><tspan fill="#e6e9ef">;</tspan></text>
<rect x="600" y="418" width="530" height="150" rx="14" fill="#171d29" stroke="#2a3447" stroke-width="1.5"/>
